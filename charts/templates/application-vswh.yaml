{{- if .Values.vault_webhook.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.argocd.appname }}-vswh"
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ignoreDifferences:
    - group: ""
      kind: "Secret"
      name: "vault-webhook-{{ .Values.cluster.namespace }}-webhook-tls"
      jsonPointers:
        - /data
    - group: "admissionregistration.k8s.io"
      kind: "MutatingWebhookConfiguration"
      name: "vault-webhook-{{ .Values.cluster.namespace }}"
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
    - group: "apps"
      kind: "Deployment"
      name: "vault-webhook-{{ .Values.cluster.namespace }}"
      jsonPointers:
        - /spec/template/metadata/annotations
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: "{{ .Values.cluster.namespace }}-vswh"
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  - repoURL: {{ .Values.vault_webhook.repo_URL }}
    targetRevision: {{ .Values.vault_webhook.targetRevision }}
    chart: {{ .Values.vault_webhook.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.vault_webhook.valueFiles }}
        - $values/app-values/vault-webhook/{{ . }}
        {{- end }}
      values: |
        mutatingWebhookConfiguration:
          annotations:
            cert-manager.io/inject-ca-from: "{{ .Values.cluster.namespace }}-vswh/vault-webhook-common-webhook-tls"
        watchNamespace: {{ .Values.cluster.namespace }}
        fullnameOverride: vault-webhook-{{ .Values.cluster.namespace }}
        serviceAccount:
          name: vault-webhook-service-account
        env:
          VAULT_ADDR: "https://secrets.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}"
          VAULT_ROLE: "{{ .Values.secrets.role }}"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.vault_webhook.resources }}
        resources: {{- toYaml .Values.vault_webhook.resources | nindent 10 }}
          {{- end }}
        {{- end }}
{{- end }}